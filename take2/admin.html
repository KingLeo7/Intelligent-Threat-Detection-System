<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDPS Admin Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: monospace; display: flex; min-height: 100vh; }
  #sidebar { width: 220px; background: #111; border-right: 2px solid #c00; padding: 20px 0; display: flex; flex-direction: column; }
  #sidebar h1 { color: #c00; font-size: 18px; text-align: center; padding: 0 10px 20px; border-bottom: 1px solid #c00; }
  #sidebar nav a { display: block; padding: 12px 20px; color: #aaa; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
  #sidebar nav a:hover, #sidebar nav a.active { color: #fff; border-left: 3px solid #c00; background: #1a0000; }
  #main { flex: 1; padding: 20px; overflow-y: auto; }
  .card { background: #111; border: 1px solid #333; margin-bottom: 16px; }
  .card-title { background: #1a0000; border-bottom: 1px solid #c00; padding: 12px 16px; color: #c00; font-size: 14px; }
  .card-body { padding: 16px; }
  .button { background: #c00; color: #fff; border: none; padding: 10px 16px; cursor: pointer; margin-top: 10px; }
  .button:hover { background: #f00; }
  .summary { margin-bottom: 14px; color: #ccc; font-size: 14px; }
  .list { margin-top: 12px; }
  .list-item { padding: 10px 12px; border-bottom: 1px solid #222; color: #ccc; }
  .list-item strong { color: #fff; }
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: #000; }
  #main::-webkit-scrollbar-thumb { background: #c00; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>🛡️ IDPS SYSTEM</h1>
    <nav>
      <a href="/dashboard">📊 Dashboard</a>
      <a href="/logs">📜 Attack Logs</a>
      <a href="/blocked">🚫 Blocked IPs</a>
      <a href="/settings">⚙️ Settings</a>
      <a href="/admin" class="active">🛠️ Admin</a>
      <a href="/logout">🔐 Logout</a>
    </nav>
  </div>
  <div id="main">
    <div class="card">
      <div class="card-title">🛠️ Admin Control Panel</div>
      <div class="card-body">
        <div class="summary">Signed in as <strong id="admin-identity">...</strong></div>
        <div class="summary">Inspect detected vulnerabilities and manage non-administrator accounts.</div>
        <button class="button" data-action="refresh">Refresh Vulnerability Summary</button>
        <div class="list" id="vulnerabilities">Loading vulnerability summary...</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">👤 Registered Users</div>
      <div class="card-body">
        <button class="button" data-action="clear-users">Remove all non-admin users</button>
        <div class="list" id="users-list">Loading user list...</div>
      </div>
    </div>
  </div>
  <script src="/csrf.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
