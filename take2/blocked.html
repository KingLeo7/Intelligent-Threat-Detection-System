<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDPS Blocked IPs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: monospace; display: flex; min-height: 100vh; }
  #sidebar { width: 220px; background: #111; border-right: 2px solid #c00; padding: 20px 0; display: flex; flex-direction: column; }
  #sidebar h1 { color: #c00; font-size: 18px; text-align: center; padding: 0 10px 20px; border-bottom: 1px solid #c00; }
  #sidebar nav a { display: block; padding: 12px 20px; color: #aaa; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
  #sidebar nav a:hover, #sidebar nav a.active { color: #fff; border-left: 3px solid #c00; background: #1a0000; }
  #main { flex: 1; padding: 20px; overflow-y: auto; }
  .card { background: #111; border: 1px solid #333; margin-bottom: 16px; }
  .card-title { background: #1a0000; border-bottom: 1px solid #c00; padding: 12px 16px; color: #c00; font-size: 14px; }
  .card-body { padding: 16px; }
  .ip-item { padding: 12px 0; border-bottom: 1px solid #222; color: #f44; font-size: 14px; }
  .ip-item:last-child { border-bottom: none; }
  button { background: #c00; color: #fff; border: none; padding: 10px 16px; cursor: pointer; margin-top: 10px; }
  button:hover { background: #f00; }
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: #000; }
  #main::-webkit-scrollbar-thumb { background: #c00; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>🛡️ IDPS SYSTEM</h1>
    <nav>
      <a href="/dashboard">📊 Dashboard</a>
      <a href="/logs">📜 Attack Logs</a>
      <a href="/blocked" class="active">🚫 Blocked IPs</a>
      <a href="/settings">⚙️ Settings</a>
    </nav>
  </div>
  <div id="main">
    <div class="card">
      <div class="card-title">🚫 Blocked IPs</div>
      <div class="card-body" id="blocked-list">Loading...</div>
      <button onclick="clearBlocked()">Clear Blocked IPs</button>
    </div>
  </div>
<script>
  const API = "";
  async function loadBlocked() {
    try {
      const res = await fetch(API + "/api/data");
      const data = await res.json();
      const blockedList = document.getElementById("blocked-list");
      if (!data.blocked_ips.length) {
        blockedList.innerHTML = '<div style="color:#555">No blocked IPs.</div>';
        return;
      }
      blockedList.innerHTML = data.blocked_ips.map(ip => `<div class="ip-item">${escHtml(ip)}</div>`).join("");
    } catch (e) {
      document.getElementById("blocked-list").innerHTML = '<div style="color:#f44">Failed to load blocked IPs.</div>';
    }
  }
  async function clearBlocked() {
    if (!confirm('Clear all blocked IPs?')) return;
    await fetch(API + '/api/clear-blocked', { method: 'POST' });
    loadBlocked();
  }
  function escHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  loadBlocked();
</script>
</body>
</html>
